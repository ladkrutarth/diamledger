name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Build
        run: npm run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diamondx
          POSTGRES_PASSWORD: diamondx
          POSTGRES_DB: diamondx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diamondx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://diamondx:diamondx@localhost:5432/diamondx_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only for the test that checks session cookies against express-session's signing.
      - run: npm ci

      - uses: astral-sh/setup-uv@v6

      - name: API tests
        working-directory: backend
        run: uv run pytest

      - name: Requirements match pyproject
        working-directory: backend
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt | grep -v '^#\|^ *#\|^-e' > /tmp/req.txt
          diff <(grep -v '^#' ../requirements.txt) /tmp/req.txt
